[project]
name = "email-agent"
version = "0.1.0"
description = "Personal Gmail classification agent using a local LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    # Plain uvicorn, not uvicorn[standard]: the extra pulls uvloop, httptools,
    # watchfiles and websockets, none of which this app uses.
    "uvicorn",
    "google-api-python-client",
    "google-auth-oauthlib",
    # Free - fastapi requires pydantic regardless, so hand-writing the config
    # validation would be more code for the same dependency.
    "pydantic",
]
# Ollama is called with stdlib urllib, as the Phase 0 spikes did. At ~10s per
# request against localhost, connection pooling and async buy nothing.

[project.optional-dependencies]
dev = [
    "pytest",
    # Not imported by our code; fastapi.testclient needs it.
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
# extend-exclude, not exclude: plain `exclude` REPLACES ruff's built-in
# defaults (.venv, __pycache__, .git ...), which we still want.
# Only the Phase 0 spikes are exempt - throwaway measurement code nobody will
# change, where a linter reporting 27 errors just gets ignored. Anything else
# in scripts/ is a tool that gets re-run and is held to the same standard.
extend-exclude = ["scripts/spike_*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
